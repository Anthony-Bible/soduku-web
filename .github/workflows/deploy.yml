name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # Pushes to main deploy to production. Pull requests from this repo get a preview URL.
      # Forked PRs have no access to secrets, so they only run the checks above.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_ACCOUNT_ID: e9d6dfba708b89e8bfa1d143ff7c549c
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.86.0 pages deploy dist --project-name sudoku-web --branch "$BRANCH" --commit-hash "$GITHUB_SHA"
